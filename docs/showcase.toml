# Showcase configuration — one [[entry]] per screenshot.
#
# refresh_showcase.py reads this file to know which themes to
# capture, in what order, with what settings. Unset keys fall
# back to the [defaults] section.
#
# Regenerate screenshots:  uv run python scripts/refresh_showcase.py
# Regenerate SHOWCASE.md:  uv run python scripts/refresh_showcase.py --generate-md

[defaults]
claude-theme = "dark-ansi"
crop-height = 300
font-size = 13
line-height = 1.1
wait-trust = 3.0
wait-welcome = 6.0

# --- Phosphor CRT types ---

[[entry]]
theme = "amber"
category = "Phosphor CRT types"
label = "warm amber on black *(default)*"
description = """The primary aesthetic. Monotone by design: every ANSI \
slot is a variant of warm amber. A software approximation of a 1983 \
DEC VT220 amber phosphor CRT."""

[[entry]]
theme = "green"
category = "Phosphor CRT types"
label = "phosphor green on black"
description = """Same single-hue design as amber. Classic IBM 3270 / \
DEC VT52 / Apple //e green-screen look."""

[[entry]]
theme = "dark"
category = "Phosphor CRT types"
label = "white on black"
description = """White phosphor CRT (P4 coating). Neutral grey ramp — no hue tint."""

[[entry]]
theme = "light"
category = "Phosphor CRT types"
claude-theme = "light-ansi"
label = "black on white"
description = """Paper-white display (original Macintosh 1984). Inverted polarity."""

# --- 8-bit / PC color schemes ---

[[entry]]
theme = "c64"
category = "8-bit / PC color schemes"
label = "Commodore 64 BASIC (Pepto NTSC)"
description = """Blue-on-blue character of the original, with fg boosted to clear WCAG AA."""

[[entry]]
theme = "dos"
category = "8-bit / PC color schemes"
label = "CGA dark blue (WordPerfect / Norton Commander)"
description = """The classic DOS full-screen application bg. WordPerfect 5.1, \
Norton Commander, Turbo C, QBasic all used CGA color 1 (#0000AA)."""


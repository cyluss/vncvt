name: Regression Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  linux-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies (including dev group)
        run: uv sync --all-groups

      - name: Run pytest suite
        run: uv run pytest tests/ -v

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: tests/baselines/baselines.json
          if-no-files-found: ignore

  linux-vncdo-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Install vncdotool CLI (third-party real client)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vncdotool

      - name: Start vncvt and drive with vncdo
        run: |
          uv run python -m vncvt --port 5995 &
          SERVER_PID=$!
          sleep 2
          vncdo -s 127.0.0.1::5995 \
                type "echo vncdo_works_on_linux" key enter \
                capture /tmp/vncdo_cross.png
          kill "$SERVER_PID" 2>/dev/null || true
          test -f /tmp/vncdo_cross.png
          uv run python -c "
          from PIL import Image
          img = Image.open('/tmp/vncdo_cross.png')
          assert img.size[0] > 700, f'unexpected width {img.size}'
          print('cross-check image size:', img.size)
          "

      - name: Upload vncdo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vncdo-cross-check
          path: /tmp/vncdo_cross.png
          if-no-files-found: ignore

  macos-screen-sharing:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Start vncvt with VNC auth
        run: |
          uv run python -m vncvt --port 5900 --password testpass &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          sleep 2

      - name: Open Screen Sharing and drive session
        run: |
          open "vnc://testpass@127.0.0.1:5900"
          sleep 6
          osascript -e 'tell application "System Events" to keystroke "echo mac-ci-works"' || true
          sleep 1
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 2
          screencapture -x -o screenshot-mac.png || true

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload macOS screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: screenshot-mac.png
          if-no-files-found: ignore

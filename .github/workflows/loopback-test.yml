name: Regression Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  linux-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system libraries for skia-python
        # skia-python's manylinux wheel links against libEGL.so.1 /
        # libGL.so.1 at import time. Ubuntu runners don't ship these
        # by default, so importing vncvt/renderer.py fails without
        # this step.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2

      - name: Install dependencies (including dev group)
        run: uv sync --all-groups

      - name: Run pytest suite
        run: uv run pytest tests/ -v

      - name: Upload scene dumps (pytest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-dumps-linux-pytest
          path: tests/scene-dumps/
          if-no-files-found: ignore

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: tests/baselines/baselines.json
          if-no-files-found: ignore

  loopback:
    # End-to-end test: spawn vncvt, drive a real VNC client (vncdotool
    # on Linux, Screen Sharing.app on macOS), verify the client sees
    # what the server rendered. Both legs share the same pytest test
    # file (tests/test_loopback.py) so the platform-specific bits stay
    # in Python, not parallel YAML blocks.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system libraries for skia-python (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2

      - name: Install dependencies (with scene-match deps)
        run: uv sync --all-groups

      - name: Run loopback test
        run: |
          uv run --with vncdotool --with scikit-image \
            pytest tests/e2e/test_loopback.py -v -m loopback

      - name: Upload scene dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-dumps-${{ matrix.os }}
          path: |
            tests/scene-dumps/
            /tmp/vncvt-ctl-*/
          if-no-files-found: ignore

name: Regression Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  linux-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies (including dev group)
        run: uv sync --all-groups

      - name: Run pytest suite
        run: uv run pytest tests/ -v

      - name: Upload scene dumps (pytest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-dumps-linux-pytest
          path: tests/scene-dumps/
          if-no-files-found: ignore

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: tests/baselines/baselines.json
          if-no-files-found: ignore

  linux-vncdo-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Start vncvt with scene-dump control socket
        env:
          VNCVT_LOG_RFB: "1"
        run: |
          rm -f /tmp/vncvt-scene.sock
          mkdir -p /tmp/vncvt-scenes
          uv run python -m vncvt --port 5995 \
               --log-traffic \
               --scene-dump-dir /tmp/vncvt-scenes \
               --scene-control-socket /tmp/vncvt-scene.sock \
               >/tmp/vncvt-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for both the RFB port and the control socket.
          for _ in $(seq 1 20); do
            if [ -S /tmp/vncvt-scene.sock ] && \
               (echo > /dev/tcp/127.0.0.1/5995) 2>/dev/null; then
              break
            fi
            sleep 0.2
          done

      - name: Drive vncdo and capture scene bundle
        run: |
          # vncdotool is PyPI-only; uv run --with pulls it ephemerally.
          uv run --with vncdotool vncdo -s 127.0.0.1::5995 \
                 type "echo vncdo_works_on_linux" key enter \
                 capture /tmp/vncdo_cross.png
          test -f /tmp/vncdo_cross.png

          # Trigger the server-side 4-file dump via JSON over the
          # Unix control socket, then drop the vncdo PNG in as the
          # client-side artifact to complete the bundle.
          echo '{"version":1,"op":"dump","name":"vncdo_post_echo"}' \
              | nc -U -N -w 3 /tmp/vncvt-scene.sock
          cp /tmp/vncdo_cross.png /tmp/vncvt-scenes/vncdo_post_echo/scene.client.png

          uv run python -c "
          from PIL import Image
          img = Image.open('/tmp/vncdo_cross.png')
          assert img.size[0] > 700, f'unexpected width {img.size}'
          print('cross-check image size:', img.size)
          "

      - name: Verify vncdo client matches server framebuffer
        run: |
          # Loopback (vncdo -> vncvt over localhost) has no
          # resampling, so tight thresholds are appropriate.
          # Expected same-content SSIM ~0.99; reject anything below
          # 0.90. Expected Bhattacharyya ~0.00; reject anything
          # above 0.25.
          uv run --with scikit-image --with pillow \
            python tests/check_scene_match.py \
              /tmp/vncvt-scenes/vncdo_post_echo \
              --ssim-min 0.90 \
              --bhat-max 0.25 \
              --min-std 3.0

      - name: Stop vncvt
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload scene dumps (vncdo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-dumps-linux-vncdo
          path: |
            /tmp/vncvt-scenes/
            /tmp/vncvt-server.log
          if-no-files-found: ignore

  macos-screen-sharing:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Start vncvt with VNC auth + scene-dump control socket
        env:
          VNCVT_LOG_RFB: "1"
        run: |
          rm -f /tmp/vncvt-scene.sock
          mkdir -p /tmp/vncvt-scenes
          # Redirect both streams to a log file so we capture the
          # full RFB trace (--log-traffic = hex of every byte, plus
          # VNCVT_LOG_RFB=1 = high-level message labels) as an
          # artifact. Without this the GitHub Actions UI buffers the
          # output and we lose the diagnostic context we need to
          # understand why Screen Sharing.app hangs at "Connecting...".
          uv run python -m vncvt --port 5900 --password testpass \
               --log-traffic \
               --scene-dump-dir /tmp/vncvt-scenes \
               --scene-control-socket /tmp/vncvt-scene.sock \
               >/tmp/vncvt-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            if [ -S /tmp/vncvt-scene.sock ]; then break; fi
            sleep 0.2
          done
          # Sanity: confirm the process is actually listening on 5900.
          lsof -i :5900 -n -P || true
          ps -p "$!" -o pid,stat,command || true

      - name: Open Screen Sharing and drive session
        run: |
          open "vnc://testpass@127.0.0.1:5900"
          sleep 6
          osascript -e 'tell application "System Events" to keystroke "echo mac-ci-works"' || true
          sleep 1
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 2
          # Snapshot the post-connect state of the network + processes
          # so we can tell, after the fact, whether Screen Sharing
          # actually established a TCP connection to vncvt.
          echo "--- lsof on 5900 after drive ---"
          lsof -i :5900 -n -P || true
          echo "--- Screen Sharing process ---"
          pgrep -fl "Screen Sharing" || true
          echo "--- vncvt server log tail (50 lines) ---"
          tail -n 50 /tmp/vncvt-server.log || true

      - name: Capture Screen Sharing window only
        run: |
          WINDOW_ID=$(osascript -e '
            tell application "System Events"
              tell process "Screen Sharing"
                return id of window 1
              end tell
            end tell
          ' 2>/dev/null || echo "")
          if [ -z "$WINDOW_ID" ]; then
            echo "Could not find Screen Sharing window; falling back to full-desktop capture"
            screencapture -x -o screenshot-mac-window.png || true
          else
            echo "Screen Sharing window id: $WINDOW_ID"
            screencapture -x -l "$WINDOW_ID" screenshot-mac-window.png || true
          fi
          ls -la screenshot-mac-window.png || true

      - name: Trigger scene dump and build bundle
        run: |
          # Trigger the 4-file server-side dump via JSON over the
          # Unix control socket.
          echo '{"version":1,"op":"dump","name":"mac_post_echo"}' \
              | nc -U /tmp/vncvt-scene.sock
          # Crop the title bar off the window screenshot and copy it
          # in as the client-side scene file.
          uv run --with imagehash --with pillow python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("screenshot-mac-window.png")
          if not src.exists():
              print(f"no source capture; skipping client.png copy")
              raise SystemExit(0)
          img = Image.open(src).convert("RGB")
          w, h = img.size
          cropped = img.crop((1, 28, w - 1, h - 1))
          out = Path("/tmp/vncvt-scenes/mac_post_echo/scene.client.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          cropped.save(out)
          cropped.save("screenshot-mac-cropped.png")
          print(f"wrote {out} ({cropped.size})")
          PY

      - name: Verify Screen Sharing client matches server framebuffer
        run: |
          # Screen Sharing lanczos-resamples vncvt's raster onto a
          # retina-resolution target and applies its own colour
          # profile, so same-content SSIM typically lands around
          # 0.85-0.95. Reject below 0.70. Bhattacharyya should stay
          # near 0 (black + amber palette is preserved through
          # resampling) — reject above 0.50.
          #
          # This is the check that would have caught the
          # "Connecting to 127.0.0.1..." fallback-screenshot bug: a
          # Dock + dialog capture has SSIM << 0.70 and Bhat >> 0.50
          # against the server's terminal render.
          uv run --with scikit-image --with pillow \
            python tests/check_scene_match.py \
              /tmp/vncvt-scenes/mac_post_echo \
              --ssim-min 0.70 \
              --bhat-max 0.50 \
              --min-std 3.0

      - name: Compare dHash against stored baseline (drift gate)
        run: |
          # Orthogonal check: compares the current client capture
          # against a stored dHash baseline, to detect drift in
          # Screen Sharing's own rendering pipeline over time.
          # This is a *drift* gate — it does not catch the
          # server↔client mismatch the step above catches, and
          # vice versa.
          uv run --with imagehash --with pillow \
            python tests/crop_and_hash_macos.py

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload scene dumps (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-dumps-macos
          path: |
            /tmp/vncvt-scenes/
            /tmp/vncvt-server.log
            screenshot-mac-window.png
            screenshot-mac-cropped.png
            tests/baselines/baselines-macos.json
          if-no-files-found: ignore

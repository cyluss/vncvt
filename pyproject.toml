[project]
name = "vncvt"
version = "0.1.0"
description = "VNC terminal server with VT220 amber aesthetic"
requires-python = ">=3.11"
dependencies = [
    "pyte>=0.8.2",
    "pillow>=10.0.0",
    "wcwidth>=0.2.13",
    "cryptography>=42",
]

[project.scripts]
vncvt = "vncvt.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "asyncvnc>=1.1",
    "imagehash>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not loopback'"
markers = [
    "loopback: end-to-end CI loopback tests that spawn vncvt + drive a real VNC client (vncdotool on Linux, Screen Sharing.app on macOS). Opt in with `pytest -m loopback`.",
]

[project]
name = "vncvt"
version = "0.1.0"
description = "VNC terminal server with VT220 amber aesthetic"
requires-python = ">=3.11"
dependencies = [
    "pyte==0.8.2",
    "pillow==12.2.0",
    "wcwidth==0.6.0",
    "cryptography==46.0.7",
    "skia-python==144.0.post2",
]

[project.scripts]
vncvt = "vncvt.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "asyncvnc==1.3.0",
    "imagehash==4.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vncvt"]

[tool.hatch.build.targets.wheel.force-include]
"vncvt/fonts/TerminusTTF-4.49.3.ttf" = "vncvt/fonts/TerminusTTF-4.49.3.ttf"
"vncvt/fonts/TerminusTTF-Bold-4.49.3.ttf" = "vncvt/fonts/TerminusTTF-Bold-4.49.3.ttf"
"vncvt/fonts/COPYING.terminus" = "vncvt/fonts/COPYING.terminus"
"vncvt/fonts/SarasaMonoK-Regular.ttf" = "vncvt/fonts/SarasaMonoK-Regular.ttf"
"vncvt/fonts/SarasaMonoK-Bold.ttf" = "vncvt/fonts/SarasaMonoK-Bold.ttf"
"vncvt/fonts/COPYING.sarasa" = "vncvt/fonts/COPYING.sarasa"
"vncvt/fonts/NotoColorEmoji.ttf" = "vncvt/fonts/NotoColorEmoji.ttf"
"vncvt/fonts/COPYING.noto-emoji" = "vncvt/fonts/COPYING.noto-emoji"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not loopback and not claude_code'"
markers = [
    "loopback: end-to-end CI loopback tests that spawn vncvt + drive a real VNC client (vncdotool on Linux, Screen Sharing.app on macOS). Opt in with `pytest -m loopback`.",
    "claude_code: tests that spawn the `claude` CLI under vncvt. Auto-skipped when the binary is not on PATH. Opt in with `pytest -m claude_code`.",
]
